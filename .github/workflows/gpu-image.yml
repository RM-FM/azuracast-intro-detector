name: GPU image

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: v0.1.0
      base_image:
        description: Python base image; publishing requires an exact sha256 digest
        type: string
        default: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
      source_revision:
        description: Exact source commit to build and match; defaults to the selected ref
        type: string
      generate_source_bundle:
        description: Generate and attach corresponding source from the selected source commit
        type: boolean
        default: false
      publish:
        description: Publish after completing the redistribution review
        type: boolean
        default: false
      corresponding_source_url:
        description: Public HTTPS archive of the complete corresponding source for this image
        type: string
      corresponding_source_sha256:
        description: SHA256 of the corresponding-source archive
        type: string
      redistribution_reviewed:
        description: Exact-version source, LGPL replacement rights and NVIDIA terms have been reviewed
        type: boolean
        default: false
      reviewed_image_id:
        description: Exact sha256 image ID from the reviewed reproducible candidate build
        type: string
      promote_default:
        description: Update the v1 installer alias after the anonymous full pull passes
        type: boolean
        default: false
      stage_candidate:
        description: Store the unreviewed image only in a private candidate package
        type: boolean
        default: false
permissions:
  contents: write
  packages: read

concurrency:
  group: gpu-image-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install detector dependencies
        run: python -m pip install -e .
      - name: Run unit tests
        run: cd tests && python3 -m unittest discover -s .

  worker-context:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare deterministic worker image contexts
        id: compare
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0{40}$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" "$AFTER" -- .github/workflows/gpu-image.yml; then
            workflow_changed=false
          else
            workflow_changed=true
          fi
          if $workflow_changed; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git worktree add --quiet --detach "$RUNNER_TEMP/worker-before" "$BEFORE"
          git worktree add --quiet --detach "$RUNNER_TEMP/worker-after" "$AFTER"
          SOURCE_DATE_EPOCH=0 bash "$RUNNER_TEMP/worker-before/bin/image-context.sh" worker "$RUNNER_TEMP/worker-before.tar"
          SOURCE_DATE_EPOCH=0 bash "$RUNNER_TEMP/worker-after/bin/image-context.sh" worker "$RUNNER_TEMP/worker-after.tar"
          if cmp -s "$RUNNER_TEMP/worker-before.tar" "$RUNNER_TEMP/worker-after.tar"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Worker image build skipped: deterministic worker context is unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Worker image build required: deterministic worker context changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: [tests, worker-context]
    if: >-
      always() &&
      needs.tests.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' || github.ref_name == 'develop') &&
      (github.event_name != 'push' || github.ref_name != 'develop' ||
       (needs.worker-context.result == 'success' && needs.worker-context.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      packages: write
    outputs:
      reference: ${{ steps.pushed.outputs.reference }}
      digest: ${{ steps.pushed.outputs.digest }}
      image_id: ${{ steps.identity.outputs.image_id }}
      publish: ${{ steps.publication.outputs.publish }}
      source_url: ${{ steps.publication.outputs.source_url }}
      source_sha256: ${{ steps.publication.outputs.source_sha256 }}
    env:
      IMAGE: ghcr.io/rm-fm/azuracast-intro-detector-gpu
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      SOURCE_REVISION: ${{ inputs.source_revision || github.sha }}
      GENERATE_SOURCE_BUNDLE: ${{ inputs.generate_source_bundle || false }}
      SOURCE_URL: ${{ inputs.corresponding_source_url || (github.event_name == 'release' && format('https://github.com/{0}/releases/download/{1}/corresponding-source.tar.gz', github.repository, github.event.release.tag_name)) || '' }}
      SOURCE_SHA256: ${{ inputs.corresponding_source_sha256 }}
      REDISTRIBUTION_REVIEWED: "${{ inputs.redistribution_reviewed || (github.event_name == 'release' && contains(github.event.release.body, 'REDISTRIBUTION REVIEWED: APPROVED')) }}"
      REVIEWED_IMAGE_ID: ${{ inputs.reviewed_image_id }}
      PYTHON_IMAGE: ${{ inputs.base_image || 'python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd' }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
      GHCR_VISIBILITY_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
      PUBLISH: ${{ inputs.publish || github.event_name == 'release' }}
      STAGE_CANDIDATE: ${{ inputs.stage_candidate || (github.event_name == 'push' && github.ref_name == 'develop') || github.event_name == 'release' }}
    steps:
      - name: Free runner disk space for a ~20 GB image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Validate build inputs
        run: |
          TAG="${TAG#gpu-}"
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$PYTHON_IMAGE" =~ ^python:3\.11-slim-bookworm(@sha256:[[:xdigit:]]{64})?$ ]]
          [[ "$SOURCE_REVISION" =~ ^[[:xdigit:]]{40}$ ]]
          if [[ "${{ inputs.stage_candidate }}" == true ]]; then
            test "${{ inputs.publish }}" != true
          fi
          if [[ "$GENERATE_SOURCE_BUNDLE" == true ]]; then
            test "$PUBLISH" = true
            test "$SOURCE_REVISION" = "$(git rev-parse "$TAG^{commit}")"
          fi
      - name: Check publication prerequisites
        if: inputs.publish
        run: |
          test "$REDISTRIBUTION_REVIEWED" = true
          [[ "${TAG#gpu-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REVIEWED_IMAGE_ID" =~ ^sha256:[[:xdigit:]]{64}$ ]]
          [[ "$PYTHON_IMAGE" == *@sha256:* ]]
          [[ "$SOURCE_URL" == https://* ]]
          test -n "$GHCR_VISIBILITY_TOKEN"
          if [[ "$GENERATE_SOURCE_BUNDLE" == true ]]; then
            project_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            test "${TAG#v}" = "$project_version"
            [[ "$SOURCE_URL" == "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/corresponding-source.tar.gz" ]]
            git fetch origin main
            git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          else
            [[ "$SOURCE_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --output corresponding-source.tar "$SOURCE_URL"
            printf '%s  corresponding-source.tar\n' "$SOURCE_SHA256" | sha256sum --check -
          fi
      - name: Check release prerequisites
        if: github.event_name == 'release'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          project_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${TAG#v}" = "$project_version"
          test "$REDISTRIBUTION_REVIEWED" = true
          [[ "$PYTHON_IMAGE" == *@sha256:* ]]
          test -n "$GHCR_VISIBILITY_TOKEN"
          [[ "$SOURCE_URL" == "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/corresponding-source.tar.gz" ]]
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
      - name: Build
        run: |
          bash bin/image-context.sh worker "$RUNNER_TEMP/worker-context.tar"
          sha256sum "$RUNNER_TEMP/worker-context.tar" > "$RUNNER_TEMP/worker-context.sha256"
          docker build -f gpu/Dockerfile \
            --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" \
            --build-arg CORRESPONDING_SOURCE_URL="$SOURCE_URL" \
            --build-arg IMAGE_VERSION="${TAG#gpu-}" \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            -t "$IMAGE:${TAG#gpu-}" - < "$RUNNER_TEMP/worker-context.tar"
      - name: Record candidate identity
        id: identity
        run: |
          image_id=$(docker image inspect "$IMAGE:${TAG#gpu-}" --format '{{.Id}}')
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
          printf 'Candidate image ID: %s\n' "$image_id" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REDISTRIBUTION_REVIEWED" == true ]]; then
            test "$image_id" = "$REVIEWED_IMAGE_ID"
          fi
      - name: Verify models are complete without network access
        run: |
          docker run --rm --network none --entrypoint /workspace/stem-comparison-venv/bin/python "$IMAGE:${TAG#gpu-}" /app/prefetch.py stem
          docker run --rm --network none --entrypoint /workspace/qwen-asr-venv/bin/python "$IMAGE:${TAG#gpu-}" /app/prefetch.py qwen
          docker run --rm --network none --entrypoint /workspace/qwen-asr-venv/bin/python "$IMAGE:${TAG#gpu-}" -c "import qwen_asr, transformers; print('qwen imports ok')"
          docker run --rm --network none --entrypoint /workspace/stem-comparison-venv/bin/python "$IMAGE:${TAG#gpu-}" -c "import whisper, demucs, panns_inference, yaml, soundfile; print('stem imports ok')"
          docker image inspect "$IMAGE:${TAG#gpu-}" --format 'size {{.Size}}'
      - name: Export notices and exact package inventory
        run: |
          container=$(docker create "$IMAGE:${TAG#gpu-}")
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/share/doc/intro-detector" ./image-legal
          docker image inspect "$IMAGE:${TAG#gpu-}" > ./image-legal/image.json
          cp "$RUNNER_TEMP/worker-context.sha256" ./image-legal/
      - name: Fetch and verify release source bundle
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.generate_source_bundle)
        id: release_source
        env:
          IMAGE_ID: ${{ steps.identity.outputs.image_id }}
        run: |
          mkdir -p source-material/native source-material/debian
          python3 gpu/fetch_native_sources.py --output source-material/native
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates debian-archive-keyring dpkg-dev
          snapshot=$(sed -n 's/^ARG DEBIAN_SNAPSHOT=//p' gpu/Dockerfile | head -n 1)
          test -n "$snapshot"
          python3 gpu/fetch_debian_sources.py \
            --inventory image-legal/inventory/base/debian.tsv \
            --output source-material/debian --snapshot "$snapshot"
          python3 gpu/build_source_bundle.py \
            --inventory image-legal --source-material source-material \
            --repository . --worker-context "$RUNNER_TEMP/worker-context.tar" \
            --image-id "$IMAGE_ID" --revision "$SOURCE_REVISION" \
            --output corresponding-source.tar.gz
          python3 gpu/image_inventory.py --output image-legal \
            --source-bundle corresponding-source.tar.gz \
            --image-id "$IMAGE_ID" --revision "$SOURCE_REVISION"
          source_sha256=$(sha256sum corresponding-source.tar.gz | cut -d' ' -f1)
          printf 'SOURCE_SHA256=%s\n' "$source_sha256" >> "$GITHUB_ENV"
          printf 'source_sha256=%s\n' "$source_sha256" >> "$GITHUB_OUTPUT"
      - name: Verify corresponding source against the built image
        if: env.PUBLISH == 'true' && github.event_name != 'release' && env.GENERATE_SOURCE_BUNDLE != 'true'
        env:
          IMAGE_ID: ${{ steps.identity.outputs.image_id }}
        run: |
          python3 gpu/image_inventory.py --output image-legal \
            --source-bundle corresponding-source.tar --image-id "$IMAGE_ID" --revision "$SOURCE_REVISION"
      - name: Attach corresponding source to the GitHub release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.generate_source_bundle)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" corresponding-source.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-legal
          path: image-legal/
      - name: Capture publication metadata
        id: publication
        run: |
          printf 'publish=%s\nsource_url=%s\nsource_sha256=%s\n' \
            "$PUBLISH" "$SOURCE_URL" "$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
      - name: Store a private candidate without public release
        if: env.STAGE_CANDIDATE == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_namespace=users
          if [[ "$OWNER_TYPE" == Organization ]]; then owner_namespace=orgs; fi
          package=azuracast-intro-detector-gpu-candidate
          api="$GITHUB_API_URL/$owner_namespace/$GITHUB_REPOSITORY_OWNER/packages/container/$package"
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/candidate-package.json" \
            --write-out '%{http_code}' -H "Authorization: Bearer $TOKEN" "$api")
          if [[ "$code" == 200 ]]; then
            jq --exit-status '.visibility == "private"' "$RUNNER_TEMP/candidate-package.json"
          else
            test "$code" = 404
          fi
          candidate="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$package:${TAG#gpu-}-$GITHUB_SHA"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:${TAG#gpu-}" "$candidate"
          docker push "$candidate"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$api" \
            | jq --exit-status '.visibility == "private"'
          printf 'Private candidate: %s\n' "$candidate" >> "$GITHUB_STEP_SUMMARY"
      - name: Push
        id: pushed
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE:${TAG#gpu-}" > /dev/null 2> "$RUNNER_TEMP/tag-check.log"; then
            echo 'Refusing to overwrite an existing version tag.' >&2
            exit 1
          fi
          grep -Eiq 'manifest unknown|no such manifest' "$RUNNER_TEMP/tag-check.log"
          docker push "$IMAGE:${TAG#gpu-}"
          package=azuracast-intro-detector-gpu
          api="$GITHUB_API_URL/user/packages/container/$package/visibility"
          if [[ "$OWNER_TYPE" == Organization ]]; then
            api="$GITHUB_API_URL/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$package/visibility"
          fi
          visibility=$(gh api --method PATCH "$api" -f visibility=public --jq '.visibility')
          test "$visibility" = public
          reference=$(docker image inspect "$IMAGE:${TAG#gpu-}" --format '{{index .RepoDigests 0}}')
          digest="${reference##*@}"
          [[ "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]
          printf 'reference=%s\ndigest=%s\n' "$IMAGE:${TAG#gpu-}" "$digest" >> "$GITHUB_OUTPUT"

  public-pull:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/rm-fm/azuracast-intro-detector-gpu
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      REFERENCE: ${{ needs.build.outputs.reference }}
      DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE_ID: ${{ needs.build.outputs.image_id }}
      SOURCE_URL: ${{ needs.build.outputs.source_url }}
      SOURCE_SHA256: ${{ needs.build.outputs.source_sha256 }}
    steps:
      - name: Verify anonymous manifest and full image pull on a fresh runner
        run: |
          public_config=$(mktemp -d)
          trap 'rm -rf "$public_config"' EXIT
          test -z "$(docker image ls "$IMAGE" --quiet)"
          docker --config "$public_config" manifest inspect "$REFERENCE" > manifest.json
          docker --config "$public_config" pull "$REFERENCE"
          docker image inspect "$REFERENCE" --format '{{json .RepoDigests}}' | grep -F "$IMAGE@$DIGEST"
          test "$(docker image inspect "$REFERENCE" --format '{{.Id}}')" = "$IMAGE_ID"
          docker --config "$public_config" pull "$IMAGE@$DIGEST"
          curl --fail --location --proto '=https' --proto-redir '=https' --output source.tar "$SOURCE_URL"
          printf '%s  source.tar\n' "$SOURCE_SHA256" | sha256sum --check -
          printf 'Image: %s\n\nDigest: %s\n\nSource: %s\n\nSource SHA256: %s\n' \
            "$REFERENCE" "$DIGEST" "$SOURCE_URL" "$SOURCE_SHA256" > release-evidence.md
          cat release-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Attach public image evidence to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release-evidence.md --clobber --repo "$GITHUB_REPOSITORY"
      - name: Promote the installer alias
        if: inputs.promote_default || github.event_name == 'release'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$REFERENCE" "$IMAGE:v1"
          docker push "$IMAGE:v1"
          public_config=$(mktemp -d)
          trap 'rm -rf "$public_config"' EXIT
          docker --config "$public_config" manifest inspect "$IMAGE:v1" >/dev/null
          docker --config "$public_config" pull "$IMAGE:v1"
          docker image inspect "$IMAGE:v1" --format '{{json .RepoDigests}}' | grep -F "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@v4
        with:
          name: public-image-evidence
          path: |
            release-evidence.md
            manifest.json
